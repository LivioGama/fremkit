name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A fork's pull request gets a read-only token: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The workspace scripts still run on Node: tsc, vue-tsc and Vitest are Node programs,
      # and so is the server. Bun replaces pnpm here, not node.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # bun-version-file reads packageManager from package.json, so the version CI installs is
      # the one the checkout pins.
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run lint

      # The widget catalogue test reads the real widgets/ folder, so a broken
      # manifest fails here.
      - run: bun run test

      - run: bun run build
