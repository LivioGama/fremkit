<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root {
      --np-text: var(--on-surface, var(--text, #e6e8eb));
      --np-muted: var(--text-muted, #8b93a0);
      --np-surface: var(--surface, rgba(255,255,255,.06));
      --np-border: var(--border, rgba(255,255,255,.12));
      --np-accent: var(--accent, #d9b36a);
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    body { box-sizing: border-box; padding: 12px; color: var(--np-text); font-family: var(--font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif); }
    *, *::before, *::after { box-sizing: inherit; }
    .widget { height: 100%; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
    .details { min-width: 0; }
    .head { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .text { min-width: 0; flex: 1 1 auto; }
    /* The cover is the player's own artwork, downscaled by the provider to 96 px: the tile shows
       a 64 px square and never waits on a network host to paint it. */
    .cover { width: 64px; height: 64px; flex: 0 0 auto; border-radius: 8px; object-fit: cover; background: var(--np-surface); }
    .app, .meta, .unavailable { color: var(--np-muted); font-size: calc(12px * var(--text-scale, 1)); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title { margin-top: 2px; font-size: calc(19px * var(--text-scale, 1)); font-weight: 650; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { margin-top: 3px; }
    .controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
    /* 44 px square, the house minimum for a touch target; the play button is 56 wide because it
       is the one hit without looking. The glyphs are SVG rather than ⏮/⏭/▶/Ⅱ: the font
       substitutes those characters differently on every Mac, and the curved arrows the first
       version used read as "undo", not "previous track". */
    button { width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--np-border); border-radius: 9px; color: var(--np-text); background: var(--np-surface); font: inherit; cursor: pointer; }
    button:hover, button:focus-visible { border-color: var(--np-accent); outline: none; }
    button.play { width: 56px; }
    button svg { width: 24px; height: 24px; display: block; fill: currentColor; }
    button.play svg { width: 26px; height: 26px; }
    button:disabled { opacity: .38; cursor: default; }
    .hidden { display: none; }
    html.on-light body { --np-text: var(--on-surface, #0b0d10); --np-muted: var(--on-surface, #0b0d10); }
    html.on-light .app, html.on-light .meta { opacity: .68; }
  </style>
</head>
<body>
  <main class="widget" role="group">
    <section class="details">
      <div class="head">
        <img class="cover hidden" id="cover" alt="" decoding="async">
        <div class="text">
          <div class="app" id="app"></div>
          <div class="title" id="title"></div>
          <div class="meta" id="meta"></div>
          <div class="unavailable" id="unavailable"></div>
        </div>
      </div>
    </section>
    <nav class="controls" aria-label="Playback controls">
      <button type="button" data-command="previous" id="previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2.2v12H6zM18.5 6v12L9.6 12z"/></svg>
      </button>
      <button type="button" class="play" data-command="playPause" id="play">
        <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.4v13.2L19 12z"/></svg>
        <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z"/></svg>
      </button>
      <button type="button" data-command="next" id="next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.8 6H18v12h-2.2zM5.5 6v12L14.4 12z"/></svg>
      </button>
    </nav>
  </main>
  <script>
    (function () {
      'use strict';
      var L = {
        nowPlaying: { fr: 'Lecture en cours', en: 'Now Playing' },
        nothing: { fr: 'Aucune lecture en cours', en: 'Nothing is playing' },
        unavailable: { fr: 'Lecteur indisponible', en: 'Media unavailable' },
        unknownTitle: { fr: 'Titre inconnu', en: 'Unknown title' },
        previous: { fr: 'Piste précédente', en: 'Previous track' },
        play: { fr: 'Lecture', en: 'Play' },
        pause: { fr: 'Pause', en: 'Pause' },
        next: { fr: 'Piste suivante', en: 'Next track' },
        controls: { fr: 'Commandes de lecture', en: 'Playback controls' }
      };
      var channel = 'now-playing';
      var state = null;
      var app = document.getElementById('app');
      var title = document.getElementById('title');
      var meta = document.getElementById('meta');
      var unavailable = document.getElementById('unavailable');
      var cover = document.getElementById('cover');
      var play = document.getElementById('play');
      var iconPlay = document.getElementById('icon-play');
      var iconPause = document.getElementById('icon-pause');
      var previous = document.getElementById('previous');
      var next = document.getElementById('next');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('[data-command]'));

      function value(data, key) {
        if (!data) return '';
        var nested = data.item || data.track || data.media || {};
        return data[key] != null ? data[key] : (nested[key] != null ? nested[key] : '');
      }

      function render() {
        var data = state || {};
        var song = value(data, 'title') || value(data, 'artist') || value(data, 'album');
        // A session with a state and no metadata is still a session: the controls must obey it.
        var available = data.available !== false && !!(song || data.state);
        var playing = data.state === 'playing';
        app.textContent = value(data, 'app') || value(data, 'application') || '';
        // No second title under the host's own: the empty state is the message below.
        title.textContent = available ? (value(data, 'title') || Fremkit.t(L.unknownTitle)) : '';
        meta.textContent = available ? [value(data, 'artist'), value(data, 'album')].filter(Boolean).join(' · ') : '';
        var artwork = value(data, 'artwork');
        if (artwork && available) {
          if (cover.getAttribute('src') !== artwork) cover.src = artwork;
          cover.classList.remove('hidden');
        } else {
          cover.removeAttribute('src');
          cover.classList.add('hidden');
        }
        unavailable.textContent = data.error ? Fremkit.t(L.unavailable) : Fremkit.t(L.nothing);
        unavailable.classList.toggle('hidden', !!available);
        iconPlay.classList.toggle('hidden', playing);
        iconPause.classList.toggle('hidden', !playing);
        play.setAttribute('aria-label', Fremkit.t(playing ? L.pause : L.play));
        play.title = play.getAttribute('aria-label');
        previous.setAttribute('aria-label', Fremkit.t(L.previous));
        previous.title = previous.getAttribute('aria-label');
        next.setAttribute('aria-label', Fremkit.t(L.next));
        next.title = next.getAttribute('aria-label');
        document.querySelector('.controls').setAttribute('aria-label', Fremkit.t(L.controls));
        buttons.forEach(function (button) { button.disabled = !available; });
      }

      cover.addEventListener('error', function () {
        cover.removeAttribute('src');
        cover.classList.add('hidden');
      });

      buttons.forEach(function (button) {
        button.addEventListener('click', function () {
          if (button.disabled) return;
          Promise.resolve(Fremkit.sendCommand(channel, button.getAttribute('data-command'), {})).catch(function () {});
        });
      });

      render();
      Fremkit.subscribe(channel, function (data) { state = data || null; render(); });
    }());
  </script>
</body>
</html>
